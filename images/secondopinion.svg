<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" font-family="Helvetica, Arial, sans-serif">
  <!-- Schematic: the case record stays fixed and one added sentence suggests a diagnosis.
       The suggestion can flip the model's answer either way: harm (correct -> wrong)
       or rescue (wrong -> correct). -->
  <rect x="0.5" y="0.5" width="159" height="159" rx="10" fill="#f7f9fc" stroke="#dde3ec"/>

  <!-- fixed case record -->
  <rect x="12.5" y="12.5" width="50" height="62" rx="4" fill="#ffffff" stroke="#9aa3b2"/>
  <g stroke="#c3cad6" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="24" x2="55" y2="24"/>
    <line x1="20" y1="33" x2="50" y2="33"/>
    <line x1="20" y1="42" x2="55" y2="42"/>
    <line x1="20" y1="51" x2="45" y2="51"/>
  </g>
  <line x1="20" y1="62" x2="52" y2="62" stroke="#1772d0" stroke-width="3" stroke-linecap="round"/>
  <text x="37.5" y="88" text-anchor="middle" font-size="10" fill="#1a4f8a">case record</text>

  <!-- one added sentence: the suggested diagnosis -->
  <path d="M78 14 h66 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-48 l-9 9 v-9 h-9 a5 5 0 0 1 -5 -5 v-22 a5 5 0 0 1 5 -5 z" fill="#fdebd6" stroke="#f09228"/>
  <text x="111" y="28" text-anchor="middle" font-size="9.5" fill="#b35f00">"My working</text>
  <text x="111" y="40" text-anchor="middle" font-size="9.5" fill="#b35f00">diagnosis is X"</text>
  <text x="111" y="70" text-anchor="middle" font-size="10" fill="#b35f00">+1 sentence</text>

  <!-- outcomes: the same suggestion moves answers both ways -->
  <g font-size="10.5">
    <!-- harm row -->
    <circle cx="26" cy="112" r="8" fill="#e8f4ef" stroke="#1a9e77"/>
    <polyline points="22,112 25,115.5 30.5,108.5" fill="none" stroke="#1a9e77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="112" x2="58" y2="112" stroke="#666" stroke-width="1.4"/>
    <polyline points="54,108 58,112 54,116" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="112" r="8" fill="#fdebd6" stroke="#d9600b"/>
    <g stroke="#d9600b" stroke-width="1.8" stroke-linecap="round">
      <line x1="68.5" y1="108.5" x2="75.5" y2="115.5"/><line x1="75.5" y1="108.5" x2="68.5" y2="115.5"/>
    </g>
    <text x="90" y="116" fill="#d9600b">harm</text>

    <!-- rescue row -->
    <circle cx="26" cy="138" r="8" fill="#fdebd6" stroke="#d9600b"/>
    <g stroke="#d9600b" stroke-width="1.8" stroke-linecap="round">
      <line x1="22.5" y1="134.5" x2="29.5" y2="141.5"/><line x1="29.5" y1="134.5" x2="22.5" y2="141.5"/>
    </g>
    <line x1="40" y1="138" x2="58" y2="138" stroke="#666" stroke-width="1.4"/>
    <polyline points="54,134 58,138 54,142" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="138" r="8" fill="#e8f4ef" stroke="#1a9e77"/>
    <polyline points="68,138 71,141.5 76.5,134.5" fill="none" stroke="#1a9e77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="142" fill="#1a9e77">rescue</text>
  </g>
</svg>
